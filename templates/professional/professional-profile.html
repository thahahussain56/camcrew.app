<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Manage your professional profile, portfolio, services, and share link on CamCrew — India's production marketplace."/>
<title>Professional Profile | CamCrew</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
/* ── Base & Theme System (Identical to public-profile.html) ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root,
[data-theme="dark"],
html.dark {
  --pp-bg: #06080a;
  --pp-text-main: #f8fafc;
  --pp-text-muted: #94a3b8;
  --pp-accent: #00f0ff;
  --pp-card-bg: rgba(10, 13, 17, 0.95);
  --pp-card-border: rgba(255, 255, 255, 0.08);
  --pp-chip-bg: rgba(0, 240, 255, 0.08);
  --pp-chip-text: #00f0ff;
  --pp-btn-bg: linear-gradient(135deg, #00f0ff, #00b8d9);
  --pp-btn-text: #001f22;
  --pp-btn-shadow: 0 6px 20px rgba(0, 240, 255, 0.35);
}

[data-theme="light"],
html.light {
  --pp-bg: #e0e5ec !important;
  --pp-text-main: #0f172a !important;
  --pp-text-muted: #475569 !important;
  --pp-accent: #0e5a6f !important;
  --pp-card-bg: #e0e5ec !important;
  --pp-card-border: rgba(0, 0, 0, 0.08) !important;
  --pp-chip-bg: rgba(14, 90, 111, 0.1) !important;
  --pp-chip-text: #0e5a6f !important;
  --pp-btn-bg: #0e5a6f !important;
  --pp-btn-text: #ffffff !important;
  --pp-btn-shadow: 0 4px 14px rgba(14, 90, 111, 0.30) !important;
}

body {
  background: var(--pp-bg);
  color: var(--pp-text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Light Mode Overrides */
[data-theme="light"] body,
html.light body {
  background-color: #e0e5ec !important;
  color: #0f172a !important;
}

[data-theme="light"] .hero-cover,
html.light .hero-cover {
  background: linear-gradient(135deg, rgba(14, 90, 111, 0.15) 0%, #cbd5e1 50%, rgba(14, 90, 111, 0.1) 100%) !important;
}

[data-theme="light"] .hero-cover::after,
html.light .hero-cover::after {
  background: linear-gradient(to bottom, transparent, #e0e5ec) !important;
}

[data-theme="light"] .display-name-lg,
[data-theme="light"] .stat-num,
[data-theme="light"] .svc-name,
[data-theme="light"] .sidebar-card-title,
[data-theme="light"] .share-title,
[data-theme="light"] .portfolio-card-title,
html.light .display-name-lg,
html.light .stat-num,
html.light .svc-name,
html.light .sidebar-card-title,
html.light .share-title,
html.light .portfolio-card-title {
  color: #0f172a !important;
}

[data-theme="light"] .username-tag,
[data-theme="light"] .profile-bio,
[data-theme="light"] .stat-lbl,
[data-theme="light"] .svc-desc,
[data-theme="light"] .member-badge,
[data-theme="light"] .share-sub,
html.light .username-tag,
html.light .profile-bio,
html.light .stat-lbl,
html.light .svc-desc,
html.light .member-badge,
html.light .share-sub {
  color: #475569 !important;
}

[data-theme="light"] .stats-bar,
[data-theme="light"] .sidebar-card,
[data-theme="light"] .svc-card,
[data-theme="light"] .gear-card,
[data-theme="light"] .share-card,
[data-theme="light"] .portfolio-card,
html.light .stats-bar,
html.light .sidebar-card,
html.light .svc-card,
html.light .gear-card,
html.light .share-card,
html.light .portfolio-card {
  background: #e0e5ec !important;
  border: 1px solid rgba(0, 0, 0, 0.08) !important;
  box-shadow: 4px 4px 10px #b8c2cc, -4px -4px 10px #ffffff !important;
}

[data-theme="light"] .btn-book-cta,
html.light .btn-book-cta {
  background: #0e5a6f !important;
  color: #ffffff !important;
  font-weight: 800 !important;
  box-shadow: 0 4px 14px rgba(14, 90, 111, 0.35) !important;
}

[data-theme="light"] .btn-ghost,
[data-theme="light"] .btn-icon,
[data-theme="light"] .social-btn,
html.light .btn-ghost,
html.light .btn-icon,
html.light .social-btn {
  background: #e0e5ec !important;
  color: #0f172a !important;
  border: 1px solid rgba(0, 0, 0, 0.1) !important;
  box-shadow: 3px 3px 8px #b8c2cc, -3px -3px 8px #ffffff !important;
}

[data-theme="light"] .svc-price,
[data-theme="light"] .website-link,
[data-theme="light"] .pro-title-badge,
[data-theme="light"] .url-text,
html.light .svc-price,
html.light .website-link,
html.light .pro-title-badge,
html.light .url-text {
  color: #0e5a6f !important;
}

[data-theme="light"] .url-display,
html.light .url-display {
  background: rgba(14, 90, 111, 0.08) !important;
  border: 1px solid rgba(14, 90, 111, 0.2) !important;
}

/* ── Ambient background ── */
.ambient-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.ambient-bg::before {
  content: '';
  position: absolute; top: -20%; left: -15%;
  width: 65vw; height: 65vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,240,255,0.055) 0%, transparent 70%);
  filter: blur(60px);
}
.ambient-bg::after {
  content: '';
  position: absolute; bottom: -10%; right: -10%;
  width: 55vw; height: 55vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,0.07) 0%, transparent 70%);
  filter: blur(80px);
}

/* ── Hero cover ── */
.hero-cover {
  position: relative; z-index: 1;
  height: 240px;
  background: linear-gradient(135deg,
    rgba(0,240,255,0.08) 0%,
    rgba(10,13,17,0.5) 40%,
    rgba(139,92,246,0.08) 100%);
  overflow: hidden;
}
.hero-cover::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
}
.hero-cover::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
  background: linear-gradient(to bottom, transparent, var(--pp-bg));
}
.hero-cover-glow {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 600px; height: 300px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,240,255,0.06) 0%, transparent 70%);
  filter: blur(30px); pointer-events: none;
}

/* ── Profile avatar section ── */
.profile-upper {
  position: relative; z-index: 2;
  max-width: 960px; margin: 0 auto;
  padding: 0 1.5rem;
}
.avatar-wrap {
  position: relative;
  margin-top: -4.5rem;
  display: inline-block;
}
.avatar-outer {
  width: 7.5rem; height: 7.5rem;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, #00f0ff 0%, #8b5cf6 100%);
  box-shadow: 0 0 40px rgba(0,240,255,0.3), 0 0 80px rgba(0,240,255,0.12);
}
.avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: linear-gradient(135deg, #0a1618, #0f1d20);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.8rem; font-weight: 900;
  overflow: hidden; position: relative;
}
.avatar-inner img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: 50%;
}
.verified-badge {
  position: absolute; bottom: 2px; right: 2px;
  width: 1.75rem; height: 1.75rem; border-radius: 50%;
  background: linear-gradient(135deg, #00f0ff, #00b8d9);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px rgba(0,240,255,0.6);
  border: 2.5px solid var(--pp-bg);
  z-index: 10;
}

/* ── Action Buttons ── */
.btn-ghost {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.58rem 1.15rem; border-radius: 0.75rem;
  font-size: 0.83rem; font-weight: 700; cursor: pointer;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--pp-text-main); text-decoration: none;
  transition: all 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
}
.btn-ghost:hover {
  background: rgba(0,240,255,0.08);
  border-color: var(--pp-chip-border);
  color: var(--pp-accent);
}

/* ── Profile layout ── */
.profile-grid {
  max-width: 960px; margin: 0 auto;
  padding: 0 1.5rem 5rem;
}

/* ── Name block ── */
.display-name-lg {
  font-size: 1.75rem; font-weight: 900; color: var(--pp-text-main);
  letter-spacing: -0.02em; line-height: 1.1;
}
.username-tag {
  font-size: 0.88rem; font-weight: 600; color: var(--pp-text-muted);
  margin-top: 0.2rem;
}
.pro-title-badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.3rem 0.85rem; border-radius: 999px; margin-top: 0.75rem;
  font-size: 0.75rem; font-weight: 800; letter-spacing: 0.04em;
  background: var(--pp-chip-bg);
  border: 1px solid var(--pp-chip-border);
  color: var(--pp-chip-text);
}

/* ── Stats bar ── */
.stats-bar {
  display: flex; gap: 0; margin: 1.5rem 0;
  border-radius: 1rem; overflow: hidden;
  border: 1px solid var(--pp-card-border);
  background: var(--pp-card-bg);
  backdrop-filter: blur(10px);
}
.stat-cell {
  flex: 1; padding: 1rem 0.5rem; text-align: center;
  border-right: 1px solid var(--pp-card-border);
  transition: background 0.2s;
}
.stat-cell:last-child { border-right: none; }
.stat-cell:hover { background: rgba(0,240,255,0.03); }
.stat-num { font-size: 1.4rem; font-weight: 900; color: var(--pp-text-main); display: block; line-height: 1; }
.stat-lbl { font-size: 0.63rem; font-weight: 700; color: var(--pp-text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 0.3rem; display: block; }

/* ── Bio ── */
.profile-bio {
  font-size: 0.9rem; color: var(--pp-text-muted); line-height: 1.75;
  white-space: pre-wrap; max-width: 520px;
}

/* ── Chips ── */
.chips-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.85rem 0; }
.chip {
  display: inline-flex; align-items: center; gap: 0.25rem;
  padding: 0.28rem 0.75rem; border-radius: 999px;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
  background: var(--pp-chip-bg);
  border: 1px solid var(--pp-chip-border);
  color: var(--pp-chip-text);
}
.chip-loc {
  background: rgba(139,92,246,0.08);
  border-color: rgba(139,92,246,0.22);
  color: #c084fc;
}

/* ── Social links ── */
.socials-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.85rem 0; }
.social-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.9rem; border-radius: 0.6rem;
  font-size: 0.75rem; font-weight: 700;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--pp-text-muted); text-decoration: none;
  transition: all 0.2s;
}
.social-btn:hover {
  background: var(--pp-chip-bg);
  border-color: var(--pp-chip-border);
  color: var(--pp-accent);
  transform: translateY(-1px);
}
.social-btn .material-symbols-outlined { font-size: 0.88rem; }

/* ── Website link ── */
.website-link {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.82rem; color: var(--pp-accent); font-weight: 700;
  text-decoration: none; margin: 0.5rem 0 0;
}
.website-link:hover { text-decoration: underline; }

/* ── Share Card ── */
.share-card {
  background: var(--pp-card-bg);
  border: 1px solid var(--pp-card-border);
  border-radius: 1rem;
  padding: 1.4rem 1.6rem;
  display: flex; flex-direction: column; gap: 1rem;
  margin-top: 1rem;
}
.share-title { font-size: 0.92rem; font-weight: 800; color: var(--pp-text-main); margin-bottom: 0.2rem; }
.share-sub   { font-size: 0.78rem; color: var(--pp-text-muted); }

.url-display {
  display: flex; align-items: center; gap: 0.5rem;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--pp-chip-border);
  border-radius: 0.65rem;
  padding: 0.6rem 0.9rem;
  overflow: hidden;
}
.url-display .material-symbols-outlined { font-size: 0.95rem; color: var(--pp-text-muted); flex-shrink: 0; }
.url-text {
  font-size: 0.8rem; color: var(--pp-accent); font-weight: 700;
  font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── Book CTA button ── */
.btn-book-cta {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.85rem 1.75rem; border-radius: 0.875rem;
  font-size: 0.9rem; font-weight: 900; cursor: pointer; border: none;
  background: var(--pp-btn-bg);
  color: var(--pp-btn-text);
  box-shadow: var(--pp-btn-shadow);
  text-decoration: none; transition: all 0.25s;
  letter-spacing: 0.01em;
}
.btn-book-cta:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
}

/* ── Sidebar card ── */
.sidebar-card {
  background: var(--pp-card-bg);
  border: 1px solid var(--pp-card-border);
  border-radius: 1.25rem;
  padding: 1.5rem;
  backdrop-filter: blur(16px);
  position: sticky; top: 6rem;
}
.sidebar-card-title {
  font-size: 0.65rem; font-weight: 800; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--pp-text-muted);
  margin-bottom: 1.25rem;
}

/* ── Section header ── */
.section-head {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 2.5rem 0 1.25rem;
}
.section-head-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--pp-card-border), transparent);
}
.section-head-title {
  font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--pp-text-muted);
  white-space: nowrap;
}
.section-head-count {
  font-size: 0.65rem; font-weight: 700;
  background: var(--pp-chip-bg);
  border: 1px solid var(--pp-chip-border);
  color: var(--pp-chip-text); padding: 0.15rem 0.55rem; border-radius: 999px;
}

/* ── Portfolio Card with 3-Dot Manage Menu ── */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1.25rem;
}

.portfolio-card {
  background: var(--pp-card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--pp-card-border);
  border-radius: 1rem;
  overflow: visible;
  position: relative;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
}

.portfolio-card:hover {
  border-color: var(--pp-chip-border);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
  transform: translateY(-3px);
}

.portfolio-media-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-top-left-radius: 1rem;
  border-top-right-radius: 1rem;
  background: rgba(0, 0, 0, 0.4);
  cursor: pointer;
}

.portfolio-media-wrap img,
.portfolio-media-wrap video {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform 0.4s ease;
}

.portfolio-card:hover .portfolio-media-wrap img,
.portfolio-card:hover .portfolio-media-wrap video {
  transform: scale(1.06);
}

.manage-menu-btn {
  position: absolute;
  top: 0.6rem; right: 0.6rem;
  width: 2.2rem; height: 2.2rem;
  border-radius: 50%;
  background: rgba(11, 12, 16, 0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 20;
  transition: all 0.2s;
}

.manage-menu-btn:hover {
  background: var(--pp-accent);
  color: #0b0c10;
  border-color: var(--pp-accent);
}

.manage-dropdown {
  position: absolute;
  top: 3.2rem; right: 0.6rem;
  width: 165px;
  background: rgba(18, 20, 26, 0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 0.75rem;
  padding: 0.35rem;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
  z-index: 30;
  display: none;
  animation: menuFadeIn 0.15s ease-out;
}

.manage-dropdown.active { display: block; }

@keyframes menuFadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.manage-item {
  display: flex; align-items: center; gap: 0.6rem;
  width: 100%; padding: 0.5rem 0.65rem;
  font-size: 0.78rem; font-weight: 600; color: #e2e8f0;
  background: transparent; border: none; border-radius: 0.5rem;
  cursor: pointer; transition: all 0.15s; text-align: left;
  font-family: inherit;
}

.manage-item:hover {
  background: rgba(0, 240, 255, 0.12);
  color: #00f0ff;
}

.manage-item.danger:hover {
  background: rgba(255, 77, 77, 0.15);
  color: #ff4d4d;
}

.manage-item .material-symbols-outlined { font-size: 1rem; }

.portfolio-card-info {
  padding: 0.7rem 0.85rem;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255, 255, 255, 0.02);
  border-bottom-left-radius: 1rem;
  border-bottom-right-radius: 1rem;
  border-top: 1px solid var(--pp-card-border);
}

.portfolio-card-title {
  font-size: 0.82rem; font-weight: 700; color: var(--pp-text-main);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.portfolio-card-badge {
  font-size: 0.62rem; font-weight: 800; letter-spacing: 0.05em;
  padding: 0.15rem 0.45rem; border-radius: 0.35rem;
  background: var(--pp-chip-bg); color: var(--pp-chip-text);
  border: 1px solid var(--pp-chip-border); text-transform: uppercase;
}

/* ── Services grid ── */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap: 1rem;
}
.svc-card {
  background: var(--pp-card-bg);
  border: 1px solid var(--pp-card-border);
  border-radius: 1.1rem;
  padding: 1.3rem 1.4rem;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
  backdrop-filter: blur(10px);
}
.svc-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2.5px;
  background: linear-gradient(to bottom, var(--pp-accent), rgba(0,240,255,0.2));
  border-radius: 2px 0 0 2px;
}
.svc-card:hover {
  border-color: var(--pp-chip-border);
  transform: translateY(-3px);
}
.svc-icon {
  width: 2.2rem; height: 2.2rem; border-radius: 0.65rem;
  background: var(--pp-chip-bg); border: 1px solid var(--pp-chip-border);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0.85rem;
}
.svc-name  { font-size: 0.9rem; font-weight: 800; color: var(--pp-text-main); margin-bottom: 0.3rem; }
.svc-price { font-size: 0.82rem; font-weight: 700; color: var(--pp-accent); margin-bottom: 0.3rem; }
.svc-desc  { font-size: 0.78rem; color: var(--pp-text-muted); line-height: 1.55; }

/* ── Lightbox ── */
.lb-overlay {
  position: fixed; inset: 0; z-index: 99999;
  background: rgba(0,0,0,0.93);
  backdrop-filter: blur(16px);
  display: none; align-items: center; justify-content: center; padding: 1.5rem;
}
.lb-overlay.open { display: flex; }
.lb-inner { position: relative; max-width: 880px; width: 100%; }
.lb-inner img, .lb-inner video {
  width: 100%; max-height: 82vh; object-fit: contain;
  border-radius: 1rem;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}
.lb-close {
  position: absolute; top: -3rem; right: 0;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  color: #dce4e5; cursor: pointer;
  width: 2.2rem; height: 2.2rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.lb-close:hover { background: rgba(255,255,255,0.15); }

/* ── Lightbox Nav Arrows ── */
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 2.5rem; height: 2.5rem; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
  color: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s; z-index: 10; flex-shrink: 0;
}
.lb-nav:hover { background: rgba(255,255,255,0.25); }
#lb-prev { left: -3.5rem; }
#lb-next { right: -3.5rem; }
@media (max-width: 700px) { #lb-prev { left: -2.5rem; } #lb-next { right: -2.5rem; } }

/* ── Toast ── */
#pp-toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,20,0.96);
  border: 1px solid rgba(255,255,255,0.1);
  color: #dce4e5; border-radius: 999px; padding: 0.65rem 1.4rem;
  font-size: 0.82rem; font-weight: 700;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  z-index: 999999; opacity: 0; transition: opacity 0.25s;
  white-space: nowrap;
}
#pp-toast.show { opacity: 1; }

/* ── Shimmer skeleton ── */
@keyframes shimmer { to { background-position: -200% center; } }
.skel {
  border-radius: 0.6rem;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.025) 25%,
    rgba(255,255,255,0.06) 50%,
    rgba(255,255,255,0.025) 75%);
  background-size: 200%;
  animation: shimmer 1.8s infinite;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 99px; }
</style>
</head>
<body>

    <div class="skel" style="width:7.5rem;height:7.5rem;border-radius:50%;flex-shrink:0;margin-top:0;"></div>

        <!-- Avatar -->

          </div>

            <span class="material-symbols-outlined" style="font-size:0.7rem;color:#001f22;font-variation-settings:"FILL' 1">check</span>
          </div>

        <!-- Name block -->
        <div style="padding-bottom:0.25rem;">
          <h1 class="display-name-lg" id="pp-name"></h1>

          <div id="pp-title-wrap" style="display:none;">
            <span class="pro-title-badge" id="pp-title">
              <span class="material-symbols-outlined" style="font-size:0.7rem;font-variation-settings:"FILL' 1">star</span>
            </span>

      <!-- Desktop Action Buttons -->

        <a href="/" class="btn-ghost" title="Go to Home">
          <span class="material-symbols-outlined" style="font-size:0.9rem;">home</span> Home
        </a>
        <a href="/professional-dashboard" class="btn-ghost" title="Dashboard">
          <span class="material-symbols-outlined" style="font-size:0.9rem;">dashboard</span> Dashboard
        </a>
        <a id="pp-public-link-btn" href="#" target="_blank" class="btn-ghost" title="View Public Profile">
          <span class="material-symbols-outlined" style="font-size:0.9rem;">open_in_new</span> View Public Profile
        </a>
        <a href="/professional-edit" class="btn-book-cta" style="padding:0.65rem 1.25rem;">

<!-- ── Main profile grid ── -->
<div class="profile-grid" id="profile-root">

  <!-- LEFT: Main content (skeleton) -->

    <div style="display:flex;gap:1.5rem;margin-bottom:2rem;">

      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>

<!-- Lightbox -->

<!-- Toast -->

<!-- Edit Title Modal -->
<div id="edit-title-modal" style="display:none;position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;">
  <div style="background:var(--pp-card-bg);border:1px solid var(--pp-card-border);border-radius:1rem;padding:1.5rem;width:90%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,0.8);">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <h3 style="font-size:1.1rem;font-weight:800;color:var(--pp-text-main);">Change Image Name</h3>

      <label style="display:block;font-size:0.75rem;font-weight:700;color:var(--pp-text-muted);text-transform:uppercase;margin-bottom:0.4rem;">New Title / Name</label>
      <input type="text" id="edit-title-input" class="cc-input" style="width:100%;padding:0.7rem 0.9rem;border-radius:0.6rem;background:rgba(255,255,255,0.04);border:1px solid var(--pp-card-border);color:var(--pp-text-main);font-size:0.9rem;" placeholder="Enter image title…"/>
    </div>
    <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
      <button onclick="closeEditTitleModal()" style="padding:0.6rem 1rem;border-radius:0.6rem;border:1px solid var(--pp-card-border);background:transparent;color:var(--pp-text-main);font-weight:700;cursor:pointer;">Cancel</button>
      <button id="save-title-btn" class="btn-book-cta" style="padding:0.6rem 1.25rem;">Save Name</button>

<!-- Dynamic Site Footer -->
<div id="site-footer"></div>
<script src="/static/js/header-loader.js"></script>
<script src="/static/js/footer-loader.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   State & bootstrap
═══════════════════════════════════════════════════════════════════ */
const S = { user: null, pro: null, username: null };
let _currentLightboxIndex = 0;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function strHue(s) { let h=0; for(let i=0;i<s.length;i++) h+=s.charCodeAt(i); return h%360; }
function fmtPrice(s) { return s.price ? `₹${parseInt(s.price).toLocaleString('en-IN')}${s.is_hourly?'/hr':''}` : ''; }

(async function boot() {
  const theme = localStorage.getItem('cc-theme') || 'dark';
  document.documentElement.className = theme;
  document.documentElement.setAttribute('data-theme', theme);

  let vaultFiles = [];
  try {
    const v = JSON.parse(localStorage.getItem('pro_vault') || '{"files":[]}');
    vaultFiles = v.files || [];
  } catch (_) {}

  let completedJobs = 0;
  try {
    const cachedUser = localStorage.getItem('cc_user');
    if (cachedUser) S.user = JSON.parse(cachedUser);
    const userEmail = (S.user && S.user.email) ? S.user.email.trim().toLowerCase() : '';
    const cacheKey = userEmail ? `cc_pro_profile_${userEmail}` : 'cc_pro_profile';
    const cachedPro  = localStorage.getItem(cacheKey);
    if (cachedPro)  S.pro  = JSON.parse(cachedPro);
    if (S.pro || S.user) {
      S.username = S.pro?.username || '';
      render(vaultFiles, completedJobs);
    }
  } catch (_) {}

  try {
    const [meRes, proRes, bookingsRes] = await Promise.all([
      fetch('/api/me', { credentials: 'include' }).catch(() => null),
      fetch('/api/profile', { credentials: 'include' }).catch(() => null),
      fetch('/api/bookings?status=completed&count=true', { credentials: 'include' }).catch(() => null)
    ]);

    if (!meRes || !meRes.ok) { window.location.href = '/signin.html?next=/professional-profile.html'; return; }
    const meData = await meRes.json();
    if (!meData.ok || !meData.user) { window.location.href = '/signin.html?next=/professional-profile.html'; return; }
    if (meData.user.role && meData.user.role !== 'professional' && meData.user.role !== 'admin') { window.location.href = '/index.html'; return; }
    
    S.user = meData.user;
    try { localStorage.setItem('cc_user', JSON.stringify(meData.user)); } catch (_) {}

    if (proRes && proRes.ok) {
      const proData = await proRes.json();
      if (proData.ok && proData.profile) {
        S.pro      = proData.profile;
        S.username = proData.profile.username || '';
        const userEmail = proData.profile.email ? proData.profile.email.trim().toLowerCase() : '';
        const cacheKey = userEmail ? `cc_pro_profile_${userEmail}` : 'cc_pro_profile';
        try { localStorage.setItem(cacheKey, JSON.stringify(proData.profile)); } catch (_) {}
      }
    }

    if (bookingsRes && bookingsRes.ok) {
      const bd = await bookingsRes.json();
      if (bd.ok) completedJobs = bd.count ?? bd.total ?? (bd.bookings?.length ?? 0);
    }
  } catch (err) { console.warn('Profile sync warning:', err); }

  render(vaultFiles, completedJobs);
})();

/* ═══════════════════════════════════════════════════════════════════
   Render
═══════════════════════════════════════════════════════════════════ */
function render(vaultFiles, completedJobs) {
  const skeletonUpper = document.getElementById('skeleton-upper');
  const upperContent   = document.getElementById('profile-upper-content');
  const skeletonMain  = document.getElementById('skeleton');
  const content        = document.getElementById('profile-content');

  const displayName     = S.user?.display_name || S.pro?.name || (S.user?.email?.split('@')[0]) || 'Professional';
  const title           = S.pro?.title        || '';
  const bio             = S.pro?.bio          || '';
  const categories      = S.pro?.categories   || [];
  const services        = S.pro?.services     || [];
  const locations       = S.pro?.locations    || [];
  const portfolio       = S.pro?.portfolio    || [];
  const socials         = S.pro?.socials      || {};
  const website         = S.pro?.website      || '';
  const joinedAt        = S.user?.created_at  || S.pro?.savedAt || '';
  const certifications  = S.pro?.certifications    || [];
  const equipmentRoster = S.pro?.equipment_roster  || [];

  const vaultMedia     = vaultFiles.filter(f => ['image','video'].includes(f.type));
  const allMedia       = portfolio.length ? portfolio : vaultMedia;
  const totalPortfolio = allMedia.length;

  const initial = displayName.charAt(0).toUpperCase();
  const hue     = strHue(S.username || displayName);
  const isVerified = !!(S.pro?.is_verified || S.pro?.verified);

  const avatarPhoto = S.pro?.avatar_url || S.pro?.avatarUrl || S.pro?.photo || S.user?.avatar_url || null;
  const avatarEl    = document.getElementById('pp-avatar');
  if (avatarPhoto && avatarPhoto.trim() !== '') {
    avatarEl.innerHTML = `<img src="${esc(avatarPhoto)}" alt="${esc(displayName)}" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'position:relative;z-index:2;color:hsl(${hue},80%,72%);font-size:2.8rem;font-weight:900;\\'>${initial}</span>';this.parentElement.style.background='linear-gradient(135deg,hsl(${hue},50%,12%),hsl(${(hue+60)%360},60%,18%))';">`;
    avatarEl.style.background = 'none';
  } else {
    avatarEl.innerHTML = `<span style="position:relative;z-index:2;color:hsl(${hue},80%,72%);font-size:2.8rem;font-weight:900;">${initial}</span>`;
    avatarEl.style.background = `linear-gradient(135deg,hsl(${hue},50%,12%),hsl(${(hue+60)%360},60%,18%))`;
  }

  const verifiedBadgeEl = document.getElementById('pp-verified-badge');
  if (verifiedBadgeEl) verifiedBadgeEl.style.display = isVerified ? 'flex' : 'none';

  document.getElementById('pp-name').innerHTML = `${esc(displayName)}${isVerified
    ? ` <span class="material-symbols-outlined" style="font-size:1.2rem;color:var(--pp-accent);vertical-align:middle;margin-left:0.2rem;" title="Verified Professional">verified</span>`
    : ''}`;
  if (S.username) document.getElementById('pp-username').textContent = `@${S.username}`;

  if (title) {
    const tw = document.getElementById('pp-title-wrap');
    const tb = document.getElementById('pp-title');
    tb.innerHTML = `<span class="material-symbols-outlined" style="font-size:0.7rem;font-variation-settings:"FILL' 1">star</span> ${esc(title)}`;
    tw.style.display = 'block';
  }

  if (skeletonUpper) skeletonUpper.style.display = 'none';
  if (upperContent)   upperContent.style.display   = 'block';

  /* ─ Portfolio grid — Fix 13: data-* attributes, no inline onclick ─ */
  const gridCells = allMedia.length
    ? allMedia.map((item, i) => {
        const isVideo = item.file_type === 'video' || item.type === 'video' || item.isVideo;
        const url     = item.file_url || item.fileUrl || item.url || '';
        const ttl     = item.title || item.name || `Portfolio Item #${i+1}`;
        const itemId  = item.id != null ? String(item.id) : '';

        if (!url) {
          return `<div class="portfolio-card">
            <div class="portfolio-media-wrap">
              <div class="p-cell-placeholder">
                <span class="material-symbols-outlined" style="font-size:1.75rem;color:rgba(255,255,255,0.15);">${isVideo ? 'movie' : 'image'}</span>
              </div>
            </div>
          </div>`;
        }

        return `<div class="portfolio-card" id="portfolio-card-${i}">
          <div class="portfolio-media-wrap" data-lb-index="${i}">
            ${isVideo
              ? `<video src="${esc(url)}" muted playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0" onerror="this.parentElement.style.display='none'"></video>`
              : `<img src="${esc(url)}" alt="${esc(ttl)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'p-cell-placeholder\\'><span class=\\'material-symbols-outlined\\' style=\\'font-size:1.75rem;color:rgba(255,255,255,0.15);\\'>image</span></div>'"/>`}
            <div class="p-cell-overlay">
              <span class="material-symbols-outlined" style="color:#fff;font-size:1.6rem;">${isVideo ? 'play_circle' : 'zoom_in'}</span>
            </div>
          </div>

          <button class="manage-menu-btn" title="Manage item" data-menu-index="${i}">
            <span class="material-symbols-outlined" style="font-size:1.25rem;">more_vert</span>
          </button>

          <div class="manage-dropdown" id="manage-menu-${i}">
            <button class="manage-item" data-action="rename" data-item-id="${esc(itemId)}" data-item-title="${esc(ttl)}" data-item-index="${i}">
              <span class="material-symbols-outlined">edit</span> Change Name
            </button>
            <button class="manage-item" data-action="preview" data-item-index="${i}">
              <span class="material-symbols-outlined">${isVideo ? 'play_circle' : 'visibility'}</span> Preview
            </button>
            <button class="manage-item" data-action="copy" data-item-url="${esc(url)}">
              <span class="material-symbols-outlined">link</span> Copy Link
            </button>
            <button class="manage-item danger" data-action="delete" data-item-id="${esc(itemId)}" data-item-index="${i}">
              <span class="material-symbols-outlined">delete</span> ${isVideo ? 'Delete Video' : 'Delete Image'}
            </button>
          </div>

          <div class="portfolio-card-info">
            <span class="portfolio-card-title">${esc(ttl)}</span>
            <span class="portfolio-card-badge">${isVideo ? 'VIDEO' : 'IMAGE'}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="grid-empty">
        <span class="material-symbols-outlined" style="font-size:3.5rem;color:rgba(255,255,255,0.07);">photo_library</span>
        <p style="color:var(--pp-text-muted);font-size:0.88rem;">No portfolio items shared yet.</p>
        <a href="/professional-edit" style="font-size:0.8rem;color:var(--pp-accent);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;">
          Upload & Manage Portfolio <span class="material-symbols-outlined" style="font-size:0.85rem;">arrow_forward</span>
        </a>
      </div>`;

  /* ─ Services ─ */
  const svcIcons = ['photo_camera','videocam','palette','mic','music_note','movie','star','edit'];
  const svcHTML = services.length
    ? `<div class="services-grid">${services.map((s, i) => `
        <div class="svc-card">
          <div class="svc-icon">
            <span class="material-symbols-outlined" style="font-size:1rem;color:var(--pp-accent);">${svcIcons[i%svcIcons.length]}</span>
          </div>
          <p class="svc-name">${esc(s.name)}</p>
          ${s.price ? `<p class="svc-price">${fmtPrice(s)}</p>` : ''}
          ${s.desc  ? `<p class="svc-desc">${esc(s.desc)}</p>`  : ''}
        </div>`).join('')}</div>`
    : `<div class="grid-empty"><span class="material-symbols-outlined" style="font-size:2.5rem;color:rgba(255,255,255,0.07);">work_outline</span>
        <p style="color:var(--pp-text-muted);font-size:0.88rem;">No services listed yet.</p></div>`;

  /* ─ Fix 7: Social links — robust URL builder ─ */
  const socialDefs = [
    { key:'instagram', icon:'camera_alt',  label:'Instagram', base:'https://instagram.com/' },
    { key:'facebook',  icon:'thumb_up',    label:'Facebook',  base:'https://facebook.com/'  },
    { key:'tiktok',    icon:'music_video', label:'TikTok',    base:'https://tiktok.com/@'   },
  ];
  const socialsHTML = socialDefs.filter(d => socials[d.key]).map(d => {
    const val = socials[d.key];
    let href;
    if (val.startsWith('http://') || val.startsWith('https://')) {
      href = val; // already a full URL
    } else if (val.includes('.com/') || (val.includes('.com') && !val.startsWith('@') && val.indexOf('.') < val.indexOf('.com') + 5)) {
      href = 'https://' + val; // domain without protocol (e.g. instagram.com/user)
    } else {
      href = d.base + val.replace(/^@/, ''); // handle or @handle
    }
    return `
    <a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="social-btn">
      <span class="material-symbols-outlined">${d.icon}</span>${d.label}
    </a>`;
  }).join('');

  /* ─ Fix 10: Share Profile Link — guard against blank/invalid URL ─ */
  const profileId = S.pro?.user_id || S.user?.id;
  const publicShareUrl = S.username
    ? `${window.location.origin}/@${S.username}`
    : profileId
      ? `${window.location.origin}/public-profile.html?id=${profileId}`
      : null;

  const publicLinkBtn = document.getElementById('pp-public-link-btn');
  if (publicLinkBtn) publicLinkBtn.href = publicShareUrl || '#';

  /* ─ Fix 10: Share card HTML — shows setup prompt if no valid URL ─ */
  const shareCardHTML = publicShareUrl
    ? `<div class="section-head">
        <span class="section-head-title">Share Profile</span>
        <div class="section-head-line"></div>
      </div>
      <div class="share-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
          <div>
            <p class="share-title">Your public profile link</p>
            <p class="share-sub">Share with clients — no login required to view.</p>
          </div>
          <button onclick="copyProfileLink()" class="btn-book-cta" style="padding:0.55rem 1.15rem;font-size:0.8rem;">
            <span class="material-symbols-outlined" style="font-size:0.95rem;">content_copy</span>
            Copy Link
          </button>
        </div>
        <div class="url-display">
          <span class="material-symbols-outlined">link</span>
          <span class="url-text">${esc(publicShareUrl)}</span>
        </div>
      </div>`
    : `<div class="section-head">
        <span class="section-head-title">Share Profile</span>
        <div class="section-head-line"></div>
      </div>
      <div class="share-card">
        <p class="share-sub">Your public profile link isn't available yet. Complete your profile setup to get a shareable link.</p>
        <a href="/professional-edit" style="font-size:0.82rem;color:var(--pp-accent);font-weight:700;text-decoration:none;margin-top:0.5rem;display:inline-block;">→ Complete Profile Setup</a>
      </div>`;

  /* ─ Render Layout ─ */
  if (skeletonMain) skeletonMain.style.display = 'none';
  content.style.display = 'block';
  content.innerHTML = `
    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-cell">
        <span class="stat-num">${totalPortfolio}</span>
        <span class="stat-lbl">Portfolio</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num">${services.length}</span>
        <span class="stat-lbl">Services</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num">${completedJobs}</span>
        <span class="stat-lbl">Completed</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num">${locations.length}</span>
        <span class="stat-lbl">Cities</span>
      </div>
    </div>

    <!-- Bio -->
    ${bio ? `<p class="profile-bio">${esc(bio)}</p>` : ''}

    <!-- Website -->
    ${website ? `<a href="${website.startsWith('http') ? esc(website) : 'https://'+esc(website)}"
      target="_blank" rel="noopener noreferrer" class="website-link">
      <span class="material-symbols-outlined" style="font-size:0.9rem;">open_in_new</span>
      ${esc(website.replace(/^https?:\/\//,''))}
    </a>` : ''}

    <!-- Verified Certification Badges -->
    ${(certifications && certifications.length) ? `<div class="chips-row mb-3">${certifications.map(c=>`
      <span class="chip">
        <span class="material-symbols-outlined" style="font-size:0.75rem;">verified</span>
        ${esc(c)}
      </span>`).join('')}</div>` : ''}

    <!-- Categories chips -->
    ${categories.length ? `<div class="chips-row">${categories.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}

    <!-- Location chips -->
    ${locations.length ? `<div class="chips-row">${locations.map(l=>`
      <span class="chip chip-loc">
        <span class="material-symbols-outlined" style="font-size:0.7rem;">location_on</span>
        ${esc(l)}
      </span>`).join('')}</div>` : ''}

    <!-- Equipment Roster section -->
    ${(equipmentRoster && equipmentRoster.length) ? `
      <div class="section-head">
        <span class="section-head-title">Equipment Roster</span>
        <span class="section-head-count">${equipmentRoster.length}</span>
        <div class="section-head-line"></div>
      </div>
      <div class="flex flex-wrap gap-2 mb-6">
        ${equipmentRoster.map(eq => `
          <div class="gear-card" style="padding:0.5rem 0.8rem;border-radius:0.75rem;font-size:0.78rem;">
            <span style="font-size:0.65rem;font-weight:800;color:var(--pp-accent);text-transform:uppercase;display:block;">[${esc(eq.category || 'Gear')}]</span>
            <span style="font-weight:600;color:var(--pp-text-main);">${esc(eq.item || '')}</span>
          </div>`).join('')}
      </div>` : ''}

    <!-- Social links -->
    ${socialsHTML ? `<div class="socials-row">${socialsHTML}</div>` : ''}

    <!-- Share Profile Card -->
    ${shareCardHTML}

    <!-- Portfolio Section -->
    <div class="section-head">
      <span class="section-head-title">Portfolio</span>
      ${allMedia.length ? `<span class="section-head-count">${allMedia.length}</span>` : ''}
      <div class="section-head-line"></div>
    </div>
    <div class="portfolio-grid" id="portfolio-grid">${gridCells}</div>

    <!-- Services Section -->
    <div class="section-head">
      <span class="section-head-title">Services</span>
      ${services.length ? `<span class="section-head-count">${services.length}</span>` : ''}
      <div class="section-head-line"></div>
    </div>
    ${svcHTML}
  `;

  window._lightboxMedia = allMedia;

  // Fix 13: Attach delegated event listeners after DOM update
  attachPortfolioEvents();
}

/* ═══════════════════════════════════════════════════════════════════
   Fix 13: Delegated portfolio event handler (no inline onclick)
═══════════════════════════════════════════════════════════════════ */
function attachPortfolioEvents() {
  const grid = document.getElementById('portfolio-grid');
  if (!grid) return;
  // Clone to remove any stale listeners from previous render
  const freshGrid = grid.cloneNode(true);
  grid.parentNode.replaceChild(freshGrid, grid);

  freshGrid.addEventListener('click', e => {
    // Media click → lightbox
    const mediaWrap = e.target.closest('[data-lb-index]');
    if (mediaWrap && !e.target.closest('[data-menu-index]') && !e.target.closest('[data-action]')) {
      openLightbox(parseInt(mediaWrap.dataset.lbIndex, 10));
      return;
    }
    // 3-dot menu button
    const menuBtn = e.target.closest('[data-menu-index]');
    if (menuBtn) {
      e.stopPropagation();
      toggleManageMenu(parseInt(menuBtn.dataset.menuIndex, 10));
      return;
    }
    // Dropdown action
    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      const action = actionBtn.dataset.action;
      const idx    = parseInt(actionBtn.dataset.itemIndex, 10);
      const itemId = actionBtn.dataset.itemId || '';
      const url    = actionBtn.dataset.itemUrl || '';
      const ttl    = actionBtn.dataset.itemTitle || '';
      toggleManageMenu(-1);
      if (action === 'rename')  openEditTitleModal(itemId, ttl, idx);
      if (action === 'preview') openLightbox(idx);
      if (action === 'copy')    copyMediaLink(url);
      if (action === 'delete')  deletePortfolioItem(itemId, idx);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════
   Lightbox — Fix 12: prev/next keyboard navigation
═══════════════════════════════════════════════════════════════════ */
function openLightbox(i) {
  const media = window._lightboxMedia || [];
  if (i < 0 || i >= media.length) return;
  const item = media[i];
  if (!item) return;
  const url = item.file_url || item.fileUrl || item.url || '';
  if (!url) return;

  _currentLightboxIndex = i;

  const isInstagram = url.includes('instagram.com');
  const isEmbed = url.includes('youtube.com/embed') || url.includes('player.vimeo.com') || isInstagram;
  const isVid = item.file_type === 'video' || item.type === 'video' || item.isVideo;
  const container = document.getElementById('lightbox-content');

  if (isEmbed) {
    if (isInstagram) {
      container.innerHTML = `
        <div style="position:relative;width:min(340px,90vw);max-height:90vh;border-radius:1rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0" scrolling="no"
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:1rem;">
          </iframe>
          <div style="padding-top:177.78%;"></div>
        </div>`;
    } else {
      container.innerHTML = `
        <div style="position:relative;width:min(850px,90vw);border-radius:1rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;">
          </iframe>
          <div style="padding-top:56.25%;"></div>
        </div>`;
    }
  } else if (isVid) {
    container.innerHTML = `<video src="${esc(url)}" controls autoplay style="width:100%;max-height:82vh;border-radius:1rem;"></video>`;
  } else {
    container.innerHTML = `<img src="${esc(url)}" alt="Portfolio" style="width:100%;max-height:82vh;object-fit:contain;border-radius:1rem;"/>`;
  }

  document.getElementById('lightbox').classList.add('open');

  // Fix 12: Show/hide nav arrows
  const total   = media.length;
  const prevBtn = document.getElementById('lb-prev');
  const nextBtn = document.getElementById('lb-next');
  if (prevBtn) prevBtn.style.display = (total > 1 && i > 0)          ? 'flex' : 'none';
  if (nextBtn) nextBtn.style.display = (total > 1 && i < total - 1) ? 'flex' : 'none';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}

// Fix 12: Keyboard navigation — Escape + arrow keys
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') { closeLightbox(); return; }
  const total = (window._lightboxMedia || []).length;
  if (e.key === 'ArrowRight' && _currentLightboxIndex < total - 1) openLightbox(_currentLightboxIndex + 1);
  if (e.key === 'ArrowLeft'  && _currentLightboxIndex > 0)         openLightbox(_currentLightboxIndex - 1);
});

/* ═══════════════════════════════════════════════════════════════════
   Copy profile link — Fix 10: guard against blank URL
═══════════════════════════════════════════════════════════════════ */
function copyProfileLink() {
  const pid = S.pro?.user_id || S.user?.id;
  const url = S.username
    ? window.location.origin + '/@' + S.username
    : pid
      ? window.location.origin + '/public-profile.html?id=' + pid
      : null;
  if (!url) { showToast('No public profile link available yet.'); return; }
  navigator.clipboard.writeText(url)
    .then(() => showToast('Link copied to clipboard'))
    .catch(() => showToast('Could not copy link.'));
}

/* ═══════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtPrice(s) {
  if (!s.price) return '';
  const unit = s.unit || 'project';
  const num  = Number(s.price).toLocaleString('en-IN');
  return `₹${num} / ${unit}`;
}

function strHue(s) {
  let h = 0;
  for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffffff;
  return Math.abs(h) % 360;
}

function showToast(msg) {
  const t = document.getElementById('pp-toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════════════════════════════
   Portfolio Item Management
═══════════════════════════════════════════════════════════════════ */
// Fix 9: ID-based targeting — not DOM loop index — prevents mismatch after item deletion
function toggleManageMenu(index) {
  document.querySelectorAll('.manage-dropdown').forEach(m => {
    if (m.id !== `manage-menu-${index}`) m.classList.remove('active');
  });
  if (index >= 0) {
    const menu = document.getElementById(`manage-menu-${index}`);
    if (menu) menu.classList.toggle('active');
  }
}

document.addEventListener('click', () => {
  document.querySelectorAll('.manage-dropdown').forEach(m => m.classList.remove('active'));
});

function copyMediaLink(url) {
  if (!url) { showToast('No link available.'); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Image link copied to clipboard!'));
  } else {
    showToast('Image link copied!');
  }
}

async function deletePortfolioItem(itemId, itemIndex) {
  if (!confirm('Are you sure you want to delete this portfolio item?')) return;

  const card = document.getElementById(`portfolio-card-${itemIndex}`);
  if (card) { card.style.opacity = '0.3'; card.style.pointerEvents = 'none'; }

  const media     = (window._lightboxMedia || [])[itemIndex] || {};
  const targetId  = itemId || media.id;
  const targetUrl = media.file_url || media.fileUrl || media.url;

  try {
    let res;
    if (targetId && String(targetId).match(/^\d+$/)) {
      // Fix 5: credentials on primary delete
      res = await fetch(`/api/portfolio/${targetId}`, {
        method: 'DELETE',
        credentials: 'include'
      });
    } else if (targetUrl) {
      // Fix 5: credentials on fallback delete
      res = await fetch('/api/portfolio', {
        method: 'DELETE',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_url: targetUrl })
      });
    } else {
      throw new Error('Item identifier missing.');
    }

    const data = await res.json();
    if (data.ok) {
      if (card) card.remove();
      try {
        const userEmail = (S.user && S.user.email) ? S.user.email.trim().toLowerCase() : '';
        const cacheKey = userEmail ? `cc_pro_profile_${userEmail}` : 'cc_pro_profile';
        localStorage.removeItem(cacheKey);
      } catch(_) {}
      showToast('Portfolio item deleted successfully');
    } else {
      if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
      showToast(data.error || 'Failed to delete item');
    }
  } catch (err) {
    console.error('Delete portfolio error:', err);
    if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
    showToast('Failed to delete portfolio item');
  }
}

let _editingItem = null;

function openEditTitleModal(itemId, currentTitle, cardIndex) {
  _editingItem = { id: itemId, index: cardIndex };
  const input = document.getElementById('edit-title-input');
  if (input) input.value = currentTitle || '';
  const modal = document.getElementById('edit-title-modal');
  if (modal) modal.style.display = 'flex';
}

function closeEditTitleModal() {
  const modal = document.getElementById('edit-title-modal');
  if (modal) modal.style.display = 'none';
  _editingItem = null;
}

async function savePortfolioTitle() {
  if (!_editingItem) return;
  const input    = document.getElementById('edit-title-input');
  const newTitle = input ? input.value.trim() : '';
  if (!newTitle) { showToast('Please enter a title'); return; }

  // Fix 4: Validate numeric server ID before calling PATCH endpoint
  if (!_editingItem.id || !String(_editingItem.id).match(/^\d+$/)) {
    showToast('Cannot rename: this item has no server ID');
    return;
  }

  const btn = document.getElementById('save-title-btn');
  if (btn) btn.disabled = true;

  try {
    const res = await fetch(`/api/portfolio/${_editingItem.id}`, {
      method: 'PATCH',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle })
    });
    const data = await res.json();
    if (data.ok) {
      const titleEl = document.querySelector(`#portfolio-card-${_editingItem.index} .portfolio-card-title`);
      if (titleEl) titleEl.textContent = newTitle;
      showToast('Image name updated successfully!');
      closeEditTitleModal();
    } else {
      showToast(data.error || 'Failed to update title');
    }
  } catch (err) {
    console.error('Update title error:', err);
    showToast('Failed to update image name');
  } finally {
    if (btn) btn.disabled = false;
  }
}
</script>

<!-- Spacer to prevent content from hiding under fixed header -->
<div class="h-[64px] md:h-[108px]"></div>

<script>
async function fetchNotifications(limit = 5) {
    try {
        const res = await fetch(`/api/notifications?limit=${limit}`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data.ok) return;

        updateNotifBadges(data.unread_count);
    } catch (e) {
        console.error("Error fetching notifications:", e);
    }
}

function updateNotifBadges(count) {
    const b1 = document.getElementById('notif-badge');
    const b2 = document.getElementById('notif-badge-mobile');

    [b1, b2].forEach(b => {
        if (b) {
            if (count > 0) {
                b.style.display = 'flex';
                b.textContent = count > 99 ? '99+' : count;
            } else {
                b.style.display = 'none';
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    fetchNotifications(5);
    setInterval(() => fetchNotifications(5), 30000);
});
</script>

<style>
  /* ── Tesla Cybertruck sidebar — dark/light theme-aware ── */
  /* Dark mode (default) */
  :root, [data-theme="dark"] {
    --neu-bg:         #16161e;
    --neu-shadow-dark: #0d0d16;
    --neu-shadow-light: #1f1f2c;
    --neu-accent:     #1a8aff;
    --neu-text:       #e4e8f6;
    --neu-text-muted: #7a8599;
    --sb-border:      rgba(255,255,255,0.07);
    --sb-label:       #4a5568;
    --sb-icon:        #7a8599;
    --sb-badge-text:  #fff;
  }
  /* Light mode overrides */
  [data-theme="light"] {
    --neu-bg:         #eef1f8;
    --neu-shadow-dark: #c5cad8;
    --neu-shadow-light: #ffffff;
    --neu-accent:     #0060cc;
    --neu-text:       #1a1a2e;
    --neu-text-muted: #5a6880;
    --sb-border:      rgba(0,0,0,0.08);
    --sb-label:       #64748b;
    --sb-icon:        #64748b;
    --sb-badge-text:  #fff;
  }

  #sidebar {
    background: var(--neu-bg);
    box-shadow: 6px 0 24px var(--neu-shadow-dark), -2px 0 8px var(--neu-shadow-light);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .sidebar-section-label {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sb-label);
    padding: 1rem 0.85rem 0.4rem;
    transition: color 0.3s;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 0.85rem;
    border-radius: 0.85rem;
    text-decoration: none;
    color: var(--neu-text-muted);
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.18s ease;
    position: relative;
    margin-bottom: 2px;
  }
  .sidebar-link:hover {
    color: var(--neu-text);
    box-shadow: 4px 4px 9px var(--neu-shadow-dark), -4px -4px 9px var(--neu-shadow-light);
  }
  .sidebar-link:hover .sidebar-icon { color: var(--neu-accent); }
  .sidebar-link.active {
    box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light);
    color: var(--neu-accent);
    font-weight: 700;
  }
  .sidebar-link.active .sidebar-icon { color: var(--neu-accent); }
  .sidebar-link.active::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--neu-accent);
  }

  .sidebar-icon {
    font-size: 1.25rem;
    color: var(--sb-icon);
    transition: color 0.18s;
    flex-shrink: 0;
  }

  .sidebar-bottom-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 0.85rem;
    border-radius: 0.85rem;
    text-decoration: none;
    color: var(--neu-text-muted);
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.18s ease;
    margin-bottom: 2px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .sidebar-bottom-link:hover {
    box-shadow: 4px 4px 9px var(--neu-shadow-dark), -4px -4px 9px var(--neu-shadow-light);
    color: var(--neu-text);
  }
  .sidebar-bottom-link:hover .sidebar-icon { color: var(--neu-accent); }
  .sidebar-bottom-link.signout:hover { color: #ff6464; }
  .sidebar-bottom-link.signout:hover .sidebar-icon { color: #ff6464; }

  /* Sidebar logo area border */
  .sb-logo-area { border-bottom: 1px solid var(--sb-border); }
  .sb-badge-area { border-bottom: 1px solid var(--sb-border); }
  .sb-bottom-area { border-top: 1px solid var(--sb-border); }

  /* Admin name text inherits theme */
  #sidebar-admin-name { color: var(--neu-text); }
  .sb-admin-label { color: var(--neu-text-muted); }
  .sb-panel-label { color: var(--neu-text-muted); }

  #sidebar .custom-scrollbar::-webkit-scrollbar { width: 3px; }
  #sidebar .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  #sidebar .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neu-shadow-dark); border-radius: 10px; }

  /* Mobile toggle button */
  #sidebar-toggle { color: var(--neu-text-muted); }

  /* ── Theme-aware logo switching ── */
  .cc-logo-dark  { display: block; }
  .cc-logo-light { display: none;  }
  [data-theme="light"] .cc-logo-dark  { display: none;  }
  [data-theme="light"] .cc-logo-light { display: block; }
</style>

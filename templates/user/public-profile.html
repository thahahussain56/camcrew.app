<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="View this professional's portfolio, services, and ratings on CamCrew — India's production marketplace for photographers, videographers, and studios."/>
<meta property="og:title" content="CamCrew Professional Profile"/>
<meta property="og:description" content="Browse portfolio, services, and reviews. Book directly through CamCrew."/>
<meta property="og:image" content="/static/img/camcrew_studio_logo_cop_y.png"/>
<meta property="og:type" content="profile"/>
<link rel="icon" href="/static/img/camcrew_studio_logo_cop_y.png" type="image/png"/>
<title>CamCrew Professional</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
/* ── Base & Theme System ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root,
[data-theme="dark"],
html.dark {
  --pp-bg: #06080a;
  --pp-text-main: #f8fafc;
  --pp-text-muted: #94a3b8;
  --pp-accent: #00f0ff;
  --pp-card-bg: rgba(10, 13, 17, 0.95);
  --pp-card-border: rgba(255, 255, 255, 0.08);
  --pp-chip-bg: rgba(0, 240, 255, 0.08);
  --pp-chip-text: #00f0ff;
  --pp-btn-bg: linear-gradient(135deg, #00f0ff, #00b8d9);
  --pp-btn-text: #001f22;
}

[data-theme="light"],
html.light {
  --pp-bg: #e0e5ec !important;
  --pp-text-main: #0f172a !important;
  --pp-text-muted: #475569 !important;
  --pp-accent: #0e5a6f !important;
  --pp-card-bg: #e0e5ec !important;
  --pp-card-border: rgba(0, 0, 0, 0.08) !important;
  --pp-chip-bg: rgba(14, 90, 111, 0.1) !important;
  --pp-chip-text: #0e5a6f !important;
  --pp-btn-bg: #0e5a6f !important;
  --pp-btn-text: #ffffff !important;
}

body {
  background: var(--pp-bg);
  color: var(--pp-text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Light Mode Overrides */
[data-theme="light"] body,
html.light body {
  background-color: #e0e5ec !important;
  color: #0f172a !important;
}

[data-theme="light"] .hero-cover,
html.light .hero-cover {
  background: linear-gradient(135deg, rgba(14, 90, 111, 0.15) 0%, #cbd5e1 50%, rgba(14, 90, 111, 0.1) 100%) !important;
}

[data-theme="light"] .hero-cover::after,
html.light .hero-cover::after {
  background: linear-gradient(to bottom, transparent, #e0e5ec) !important;
}

[data-theme="light"] .display-name-lg,
[data-theme="light"] .stat-num,
[data-theme="light"] .svc-name,
[data-theme="light"] .sidebar-card-title,
html.light .display-name-lg,
html.light .stat-num,
html.light .svc-name,
html.light .sidebar-card-title {
  color: #0f172a !important;
}

[data-theme="light"] .username-tag,
[data-theme="light"] .profile-bio,
[data-theme="light"] .stat-lbl,
[data-theme="light"] .svc-desc,
[data-theme="light"] .member-badge,
html.light .username-tag,
html.light .profile-bio,
html.light .stat-lbl,
html.light .svc-desc,
html.light .member-badge {
  color: #475569 !important;
}

[data-theme="light"] .stats-bar,
[data-theme="light"] .sidebar-card,
[data-theme="light"] .svc-card,
[data-theme="light"] .gear-card,
html.light .stats-bar,
html.light .sidebar-card,
html.light .svc-card,
html.light .gear-card {
  background: #e0e5ec !important;
  border: 1px solid rgba(0, 0, 0, 0.08) !important;
  box-shadow: 4px 4px 10px #b8c2cc, -4px -4px 10px #ffffff !important;
}

[data-theme="light"] .btn-book-cta,
html.light .btn-book-cta {
  background: #0e5a6f !important;
  color: #ffffff !important;
  font-weight: 800 !important;
  box-shadow: 0 4px 14px rgba(14, 90, 111, 0.35) !important;
}

[data-theme="light"] .btn-book-cta:hover,
html.light .btn-book-cta:hover {
  background: #0b3c49 !important;
  box-shadow: 0 6px 18px rgba(14, 90, 111, 0.45) !important;
}

[data-theme="light"] .social-btn,
html.light .social-btn {
  background: #e0e5ec !important;
  color: #0f172a !important;
  border: 1px solid rgba(0, 0, 0, 0.1) !important;
  box-shadow: 3px 3px 8px #b8c2cc, -3px -3px 8px #ffffff !important;
}

[data-theme="light"] .svc-price,
[data-theme="light"] .website-link,
[data-theme="light"] .pro-title-badge,
html.light .svc-price,
html.light .website-link,
html.light .pro-title-badge {
  color: #0e5a6f !important;
}

/* ── Ambient background ── */
.ambient-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.ambient-bg::before {
  content: '';
  position: absolute; top: -20%; left: -15%;
  width: 65vw; height: 65vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,240,255,0.055) 0%, transparent 70%);
  filter: blur(60px);
}
.ambient-bg::after {
  content: '';
  position: absolute; bottom: -10%; right: -10%;
  width: 55vw; height: 55vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,0.07) 0%, transparent 70%);
  filter: blur(80px);
}

/* ── Hero cover ── */
.hero-cover {
  position: relative; z-index: 1;
  height: 240px;
  background: linear-gradient(135deg,
    rgba(0,240,255,0.08) 0%,
    rgba(10,13,17,0.5) 40%,
    rgba(139,92,246,0.08) 100%);
  overflow: hidden;
}
.hero-cover::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
}
.hero-cover::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
  background: linear-gradient(to bottom, transparent, var(--pp-bg));
}
.hero-cover-glow {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 600px; height: 300px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,240,255,0.06) 0%, transparent 70%);
  filter: blur(30px); pointer-events: none;
}

/* ── Profile avatar section ── */
.profile-upper {
  position: relative; z-index: 2;
  max-width: 960px; margin: 0 auto;
  padding: 0 1.5rem;
}
.avatar-wrap {
  position: relative;
  margin-top: -4.5rem;
  display: inline-block;
}
.avatar-outer {
  width: 7.5rem; height: 7.5rem;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, #00f0ff 0%, #8b5cf6 100%);
  box-shadow: 0 0 40px rgba(0,240,255,0.3), 0 0 80px rgba(0,240,255,0.12);
}
.avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: linear-gradient(135deg, #0a1618, #0f1d20);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.8rem; font-weight: 900;
  overflow: hidden; position: relative;
}
.avatar-inner img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: 50%;
}
.verified-badge {
  position: absolute; bottom: 2px; right: 2px;
  width: 1.75rem; height: 1.75rem; border-radius: 50%;
  background: linear-gradient(135deg, #00f0ff, #00b8d9);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px rgba(0,240,255,0.6);
  border: 2.5px solid var(--pp-bg);
  z-index: 10;
}

/* ── Profile layout ── */
.profile-grid {
  max-width: 960px; margin: 0 auto;
  padding: 0 1.5rem 5rem;
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 2rem;
  align-items: start;
}
@media (max-width: 768px) {
  .profile-grid { grid-template-columns: 1fr; }
  .profile-sidebar { order: -1; }
}

/* ── Name block ── */
.display-name-lg {
  font-size: 1.75rem; font-weight: 900; color: var(--pp-text-main);
  letter-spacing: -0.02em; line-height: 1.1;
}
.username-tag {
  font-size: 0.88rem; font-weight: 600; color: var(--pp-text-muted);
  margin-top: 0.2rem;
}
.pro-title-badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.3rem 0.85rem; border-radius: 999px; margin-top: 0.75rem;
  font-size: 0.75rem; font-weight: 800; letter-spacing: 0.04em;
  background: var(--pp-chip-bg);
  border: 1px solid var(--pp-chip-border);
  color: var(--pp-chip-text);
}

/* ── Stats bar ── */
.stats-bar {
  display: flex; gap: 0; margin: 1.5rem 0;
  border-radius: 1rem; overflow: hidden;
  border: 1px solid var(--pp-card-border);
  background: var(--pp-card-bg);
  backdrop-filter: blur(10px);
}
.stat-cell {
  flex: 1; padding: 1rem 0.5rem; text-align: center;
  border-right: 1px solid var(--pp-card-border);
  transition: background 0.2s;
}
.stat-cell:last-child { border-right: none; }
.stat-cell:hover { background: rgba(0,240,255,0.03); }
.stat-num { font-size: 1.4rem; font-weight: 900; color: var(--pp-text-main); display: block; line-height: 1; }
.stat-lbl { font-size: 0.63rem; font-weight: 700; color: var(--pp-text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 0.3rem; display: block; }

/* ── Bio ── */
.profile-bio {
  font-size: 0.9rem; color: var(--pp-text-muted); line-height: 1.75;
  white-space: pre-wrap; max-width: 520px;
}

/* ── Chips ── */
.chips-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.85rem 0; }
.chip {
  display: inline-flex; align-items: center; gap: 0.25rem;
  padding: 0.28rem 0.75rem; border-radius: 999px;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
  background: var(--pp-chip-bg);
  border: 1px solid var(--pp-chip-border);
  color: var(--pp-chip-text);
}
.chip-loc {
  background: rgba(139,92,246,0.08);
  border-color: rgba(139,92,246,0.22);
  color: #c084fc;
}

/* ── Social links ── */
.socials-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.85rem 0; }
.social-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.9rem; border-radius: 0.6rem;
  font-size: 0.75rem; font-weight: 700;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--pp-text-muted); text-decoration: none;
  transition: all 0.2s;
}
.social-btn:hover {
  background: var(--pp-chip-bg);
  border-color: var(--pp-chip-border);
  color: var(--pp-accent);
  transform: translateY(-1px);
}
.social-btn .material-symbols-outlined { font-size: 0.88rem; }

/* ── Website link ── */
.website-link {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.82rem; color: var(--pp-accent); font-weight: 700;
  text-decoration: none; margin: 0.5rem 0 0;
}
.website-link:hover { text-decoration: underline; }

/* ── Member since ── */
.member-badge {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.7rem; color: var(--pp-text-muted); font-weight: 600;
  margin: 0.75rem 0 0;
}

/* ── Book CTA button ── */
.btn-book-cta {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.85rem 1.75rem; border-radius: 0.875rem;
  font-size: 0.9rem; font-weight: 900; cursor: pointer; border: none;
  background: var(--pp-btn-bg);
  color: var(--pp-btn-text);
  box-shadow: var(--pp-btn-shadow);
  text-decoration: none; transition: all 0.25s;
  letter-spacing: 0.01em;
}
.btn-book-cta:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
}

/* ── Sidebar card ── */
.sidebar-card {
  background: var(--pp-card-bg);
  border: 1px solid var(--pp-card-border);
  border-radius: 1.25rem;
  padding: 1.5rem;
  backdrop-filter: blur(16px);
  position: sticky; top: 6rem;
}
.sidebar-card-title {
  font-size: 0.65rem; font-weight: 800; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--pp-text-muted);
  margin-bottom: 1.25rem;
}

/* ── Section header ── */
.section-head {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 2.5rem 0 1.25rem;
}
.section-head-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--pp-card-border), transparent);
}
.section-head-title {
  font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--pp-text-muted);
  white-space: nowrap;
}
.section-head-count {
  font-size: 0.65rem; font-weight: 700;
  background: var(--pp-chip-bg);
  border: 1px solid var(--pp-chip-border);
  color: var(--pp-chip-text); padding: 0.15rem 0.55rem; border-radius: 999px;
}

/* ── Portfolio grid ── */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  border-radius: 1.1rem;
  overflow: hidden;
}
.p-cell {
  aspect-ratio: 1; position: relative; overflow: hidden;
  background: rgba(255,255,255,0.025); cursor: pointer;
}
.p-cell:first-child { border-radius: 1rem 0 0 0; }
.p-cell:nth-child(3) { border-radius: 0 1rem 0 0; }
.p-cell img, .p-cell video {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform 0.4s cubic-bezier(.4,0,.2,1);
}
.p-cell:hover img, .p-cell:hover video { transform: scale(1.08); }
.p-cell-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.25s;
}
.p-cell:hover .p-cell-overlay { opacity: 1; }
.p-cell-placeholder {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.35rem;
}
.grid-empty {
  grid-column: 1/-1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.75rem;
  padding: 4rem 2rem; text-align: center;
  border: 1px dashed var(--pp-card-border); border-radius: 1rem;
}

/* ── Services grid ── */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap: 1rem;
}
.svc-card {
  background: var(--pp-card-bg);
  border: 1px solid var(--pp-card-border);
  border-radius: 1.1rem;
  padding: 1.3rem 1.4rem;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
  backdrop-filter: blur(10px);
}
.svc-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2.5px;
  background: linear-gradient(to bottom, var(--pp-accent), rgba(0,240,255,0.2));
  border-radius: 2px 0 0 2px;
}
.svc-card:hover {
  border-color: var(--pp-chip-border);
  transform: translateY(-3px);
}
.svc-icon {
  width: 2.2rem; height: 2.2rem; border-radius: 0.65rem;
  background: var(--pp-chip-bg); border: 1px solid var(--pp-chip-border);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0.85rem;
}
.svc-name  { font-size: 0.9rem; font-weight: 800; color: var(--pp-text-main); margin-bottom: 0.3rem; }
.svc-price { font-size: 0.82rem; font-weight: 700; color: var(--pp-accent); margin-bottom: 0.3rem; }
.svc-desc  { font-size: 0.78rem; color: var(--pp-text-muted); line-height: 1.55; }

/* ── Lightbox ── */
.lb-overlay {
  position: fixed; inset: 0; z-index: 99999;
  background: rgba(0,0,0,0.93);
  backdrop-filter: blur(16px);
  display: none; align-items: center; justify-content: center; padding: 1.5rem;
}
.lb-overlay.open { display: flex; }
.lb-inner { position: relative; max-width: 880px; width: 100%; }
.lb-inner img, .lb-inner video {
  width: 100%; max-height: 82vh; object-fit: contain;
  border-radius: 1rem;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}
.lb-close {
  position: absolute; top: -3rem; right: 0;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  color: #dce4e5; cursor: pointer;
  width: 2.2rem; height: 2.2rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.lb-close:hover { background: rgba(255,255,255,0.15); }

/* ── State screens ── */
.state-box {
  min-height: 55vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1rem;
  text-align: center; padding: 2rem;
}

/* ── Shimmer skeleton ── */
@keyframes shimmer { to { background-position: -200% center; } }
.skel {
  border-radius: 0.6rem;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.025) 25%,
    rgba(255,255,255,0.06) 50%,
    rgba(255,255,255,0.025) 75%);
  background-size: 200%;
  animation: shimmer 1.8s infinite;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 99px; }
</style>
</head>
<body>

<!-- Ambient bg -->
<div class="ambient-bg"></div>

<!-- Shared site header -->
<div id="site-header" style="position:relative;z-index:50;"></div>

<!-- ── Hero cover ── -->
<div class="hero-cover" style="position:relative;z-index:1;">
  <div class="hero-cover-glow"></div>
</div>

<!-- ── Profile upper (avatar + quick actions) ── -->
<div class="profile-upper" style="padding-top:0;">
  <div id="skeleton-upper" style="display:flex;align-items:flex-end;gap:1.75rem;padding-top:0;margin-top:-4.5rem;padding-bottom:1.5rem;flex-wrap:wrap;">
    <div class="skel" style="width:7.5rem;height:7.5rem;border-radius:50%;flex-shrink:0;margin-top:0;"></div>
    <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:0.6rem;padding-bottom:0.5rem;">
      <div class="skel" style="height:1.75rem;max-width:220px;"></div>
      <div class="skel" style="height:1rem;max-width:140px;"></div>
    </div>
  </div>
  <div id="profile-upper-content" style="display:none;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding-bottom:0.5rem;">
      <div style="display:flex;align-items:flex-end;gap:1.5rem;flex-wrap:wrap;">
        <!-- Avatar -->
        <div class="avatar-wrap">
          <div class="avatar-outer">
            <div class="avatar-inner" id="pp-avatar"></div>
          </div>
          <div class="verified-badge">
            <span class="material-symbols-outlined" style="font-size:0.7rem;color:#001f22;font-variation-settings:"FILL' 1">check</span>
          </div>
        </div>
        <!-- Name block -->
        <div style="padding-bottom:0.25rem;">
          <h1 class="display-name-lg" id="pp-name"></h1>
          <p class="username-tag" id="pp-username"></p>
          <div id="pp-title-wrap" style="display:none;">
            <span class="pro-title-badge" id="pp-title">
              <span class="material-symbols-outlined" style="font-size:0.7rem;font-variation-settings:"FILL' 1">star</span>
            </span>
          </div>
        </div>
      </div>
      <!-- Desktop CTA -->
      <div id="pp-cta-wrap" style="padding-bottom:0.5rem;display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
        <a id="pp-book-btn" href="#" class="btn-book-cta">
          <span class="material-symbols-outlined" style="font-size:1rem;">calendar_month</span>
          Book Now
        </a>
      </div>
    </div>
  </div>
</div>

<!-- ── Main profile grid ── -->
<div class="profile-grid" id="profile-content">

  <!-- LEFT: Main content (skeleton) -->
  <div id="skeleton-main" style="grid-column:1/-1;">
    <div style="display:flex;gap:1.5rem;margin-bottom:2rem;">
      <div class="skel" style="flex:1;height:5.5rem;border-radius:1rem;"></div>
    </div>
    <div class="skel" style="height:4rem;border-radius:0.75rem;margin-bottom:1rem;max-width:480px;"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:1.1rem;overflow:hidden;">
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
      <div class="skel" style="aspect-ratio:1;"></div>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div id="lb" class="lb-overlay" onclick="closeLb()">
  <div class="lb-inner" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeLb()">
      <span class="material-symbols-outlined" style="font-size:1rem;">close</span>
    </button>
    <div id="lb-content"></div>
  </div>
</div>

<!-- Dynamic Site Footer -->
<div id="site-footer"></div>
<script src="/static/js/header-loader.js"></script>
<script src="/static/js/footer-loader.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════
   Boot & Universal Profile URL Resolution
══════════════════════════════════════════════════════════════ */
(async function () {
  const urlParams = new URLSearchParams(window.location.search);
  const paramUser = urlParams.get('username') || urlParams.get('pro') || urlParams.get('id');

  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const atPart    = pathParts.find(p => p.startsWith('@'));
  const pathUser  = atPart ? atPart.slice(1) : null;

  const targetQuery = paramUser || pathUser;

  if (!targetQuery) {
    showError('link_off', 'Invalid profile link.', 'This URL doesn\'t specify a valid CamCrew profile.');
    return;
  }

  document.title = `@${targetQuery} | CamCrew`;

  let data;
  try {
    const res = await fetch(`/api/profile/@${encodeURIComponent(targetQuery)}`);
    data = await res.json();
  } catch (_) {
    showError('wifi_off', 'Unable to load profile.', 'Please check your connection and try again.');
    return;
  }

  if (!data.ok) {
    showError('person_off', data.error || 'Profile not found.',
      'This account may not exist or has been removed.');
    return;
  }

  renderProfile(data.profile);
})();

/* ══════════════════════════════════════════════════════════════
   Render
══════════════════════════════════════════════════════════════ */
function renderProfile(p) {
  document.title = `@${p.username} — ${p.display_name} | CamCrew`;

  const initial     = (p.display_name || p.username || '?').charAt(0).toUpperCase();
  const hue         = strHue(p.username || '');
  const memberSince = p.joined_at
    ? new Date(p.joined_at).toLocaleDateString('en-US', { month:'long', year:'numeric' }) : '';

  const portfolio = p.portfolio || [];
  const services  = p.services  || [];
  const cats      = p.categories || [];
  const locs      = p.locations  || [];
  const socials   = p.socials    || {};

  window._lbMedia = portfolio;

  /* ── Upper profile strip ── */
  const avatarEl = document.getElementById('pp-avatar');
  const avatarUrl = p.avatar_url || p.avatarUrl;
  if (avatarUrl && avatarUrl.trim() !== '') {
    avatarEl.innerHTML = `<img src="${esc(avatarUrl)}" alt="${esc(p.display_name || p.username)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;z-index:2;" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'position:relative;z-index:2;color:hsl(${hue},80%,72%);font-size:2.8rem;font-weight:900;\\'>${initial}</span>';this.parentElement.style.background='linear-gradient(135deg,hsl(${hue},50%,12%),hsl(${(hue+60)%360},60%,18%))';">`;
    avatarEl.style.background = 'none';
  } else {
    avatarEl.innerHTML = `<span style="position:relative;z-index:2;color:hsl(${hue},80%,72%);font-size:2.8rem;font-weight:900;">${initial}</span>`;
    avatarEl.style.background = `linear-gradient(135deg,hsl(${hue},50%,12%),hsl(${(hue+60)%360},60%,18%))`;
  }

  document.getElementById('pp-name').innerHTML     = `${esc(p.display_name || p.username)} <span class="material-symbols-outlined" style="font-size:1.2rem;color:var(--pp-accent);vertical-align:middle;margin-left:0.2rem;" title="Official Verified Professional">verified</span>`;
  document.getElementById('pp-username').textContent = `@${p.username}`;

  if (p.title) {
    const tw = document.getElementById('pp-title-wrap');
    const tb = document.getElementById('pp-title');
    tb.insertAdjacentText('beforeend', p.title);
    tw.style.display = 'block';
  }

  const bookBtn = document.getElementById('pp-book-btn');
  bookBtn.href = `/book.html?pro=${encodeURIComponent(p.username)}`;

  document.getElementById('skeleton-upper').style.display = 'none';
  document.getElementById('profile-upper-content').style.display = 'block';

  /* ── Portfolio grid ── */
  const gridCells = portfolio.length
    ? portfolio.map((item, i) => {
        const isVid = item.file_type === 'video';
        if (!item.file_url) {
          return `<div class="p-cell">
            <div class="p-cell-placeholder">
              <span class="material-symbols-outlined" style="font-size:1.8rem;color:rgba(255,255,255,0.1);">${isVid?'movie':'image'}</span>
              <span style="font-size:0.7rem;color:var(--pp-text-muted);">${esc(item.title||'')}</span>
            </div>
          </div>`;
        }
        return `<div class="p-cell" onclick="openLb(${i})">
          ${isVid
            ? `<video src="${esc(item.file_url)}" muted playsinline preload="metadata"
                 onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0"></video>`
            : `<img src="${esc(item.file_url)}" alt="${esc(item.title||'Portfolio')}" loading="lazy"/>`}
          <div class="p-cell-overlay">
            <span class="material-symbols-outlined" style="color:#fff;font-size:1.6rem;">${isVid?'play_circle':'zoom_in'}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="grid-empty">
        <span class="material-symbols-outlined" style="font-size:3.5rem;color:rgba(255,255,255,0.07);">photo_library</span>
        <p style="color:var(--pp-text-muted);font-size:0.88rem;">No portfolio items shared yet.</p>
      </div>`;

  /* ── Services ── */
  const svcIcons = ['photo_camera','videocam','palette','mic','music_note','movie','star','edit'];
  const svcHTML = services.length
    ? `<div class="services-grid">${services.map((s, i) => `
        <div class="svc-card">
          <div class="svc-icon">
            <span class="material-symbols-outlined" style="font-size:1rem;color:var(--pp-accent);">${svcIcons[i%svcIcons.length]}</span>
          </div>
          <p class="svc-name">${esc(s.name)}</p>
          ${s.price ? `<p class="svc-price">${fmtPrice(s)}</p>` : ''}
          ${s.desc  ? `<p class="svc-desc">${esc(s.desc)}</p>`  : ''}
        </div>`).join('')}</div>`
    : `<div class="grid-empty"><span class="material-symbols-outlined" style="font-size:2.5rem;color:rgba(255,255,255,0.07);">work_outline</span>
        <p style="color:var(--pp-text-muted);font-size:0.88rem;">No services listed yet.</p></div>`;

  /* ── Socials ── */
  const socialDefs = [
    { key:'instagram', icon:'camera_alt',  label:'Instagram', base:'https://instagram.com/' },
    { key:'facebook',  icon:'thumb_up',    label:'Facebook',  base:'https://facebook.com/'  },
    { key:'tiktok',    icon:'music_video', label:'TikTok',    base:'https://tiktok.com/@'   },
  ];
  const socialsHTML = socialDefs.filter(d => socials[d.key]).map(d => `
    <a href="${socials[d.key].startsWith('http') ? esc(socials[d.key]) : esc(d.base+socials[d.key])}"
       target="_blank" rel="noopener noreferrer" class="social-btn">
      <span class="material-symbols-outlined">${d.icon}</span>${d.label}
    </a>`).join('');

  /* ── Render into grid ── */
  document.getElementById('skeleton-main').remove();
  document.getElementById('profile-content').innerHTML = `

    <!-- LEFT COLUMN -->
    <div>
      <!-- Stats bar -->
      <div class="stats-bar">
        <div class="stat-cell">
          <span class="stat-num">${portfolio.length}</span>
          <span class="stat-lbl">Portfolio</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${services.length}</span>
          <span class="stat-lbl">Services</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${locs.length}</span>
          <span class="stat-lbl">Cities</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${cats.length}</span>
          <span class="stat-lbl">Skills</span>
        </div>
      </div>

      <!-- Bio -->
      ${p.bio ? `<p class="profile-bio">${esc(p.bio)}</p>` : ''}

      <!-- Website -->
      ${p.website ? `<a href="${p.website.startsWith('http') ? esc(p.website) : 'https://'+esc(p.website)}"
        target="_blank" rel="noopener noreferrer" class="website-link">
        <span class="material-symbols-outlined" style="font-size:0.9rem;">open_in_new</span>
        ${esc(p.website.replace(/^https?:\/\//,''))}
      </a>` : ''}

      <!-- Verified Certification Badges -->
      ${(p.certifications && p.certifications.length) ? `<div class="chips-row mb-3">${p.certifications.map(c=>`
        <span class="chip">
          <span class="material-symbols-outlined" style="font-size:0.75rem;">verified</span>
          ${esc(c)}
        </span>`).join('')}</div>` : ''}

      <!-- Categories chips -->
      ${cats.length ? `<div class="chips-row">${cats.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}

      <!-- Location chips -->
      ${locs.length ? `<div class="chips-row">${locs.map(l=>`
        <span class="chip chip-loc">
          <span class="material-symbols-outlined" style="font-size:0.7rem;">location_on</span>
          ${esc(l)}
        </span>`).join('')}</div>` : ''}

      <!-- Equipment Roster section -->
      ${(p.equipment_roster && p.equipment_roster.length) ? `
        <div class="section-head">
          <span class="section-head-title">Equipment Roster</span>
          <span class="section-head-count">${p.equipment_roster.length}</span>
          <div class="section-head-line"></div>
        </div>
        <div class="flex flex-wrap gap-2 mb-6">
          ${p.equipment_roster.map(eq => `
            <div class="gear-card" style="padding:0.5rem 0.8rem;border-radius:0.75rem;font-size:0.78rem;">
              <span style="font-size:0.65rem;font-weight:800;color:var(--pp-accent);text-transform:uppercase;display:block;">[${esc(eq.category || 'Gear')}]</span>
              <span style="font-weight:600;color:var(--pp-text-main);">${esc(eq.item || '')}</span>
            </div>`).join('')}
        </div>` : ''}

      <!-- Social links -->
      ${socialsHTML ? `<div class="socials-row">${socialsHTML}</div>` : ''}

      <!-- Member since -->
      ${memberSince ? `<div class="member-badge">
        <span class="material-symbols-outlined" style="font-size:0.82rem;">calendar_month</span>
        Member since ${memberSince}
      </div>` : ''}

      <!-- Portfolio section -->
      <div class="section-head">
        <span class="section-head-title">Portfolio</span>
        ${portfolio.length ? `<span class="section-head-count">${portfolio.length}</span>` : ''}
        <div class="section-head-line"></div>
      </div>
      <div class="portfolio-grid">${gridCells}</div>

      <!-- Services section -->
      <div class="section-head">
        <span class="section-head-title">Services</span>
        ${services.length ? `<span class="section-head-count">${services.length}</span>` : ''}
        <div class="section-head-line"></div>
      </div>
      ${svcHTML}
    </div>

    <!-- RIGHT COLUMN: Sidebar -->
    <div class="profile-sidebar">
      <div class="sidebar-card">
        <p class="sidebar-card-title">Quick Booking</p>

        <!-- Mini avatar + name -->
        <div style="display:flex;align-items:center;gap:0.85rem;margin-bottom:1.25rem;">
          <div style="width:2.8rem;height:2.8rem;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,hsl(${hue},50%,12%),hsl(${(hue+60)%360},60%,18%));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.95rem;color:hsl(${hue},80%,72%);position:relative;">
            ${(p.avatar_url || p.avatarUrl) ? `<img src="${esc(p.avatar_url || p.avatarUrl)}" alt="${esc(p.display_name||p.username)}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">` : initial}
          </div>
          <div style="min-width:0;">
            <p style="font-weight:800;font-size:0.9rem;color:var(--pp-text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.display_name||p.username)}</p>
            ${p.title ? `<p style="font-size:0.72rem;color:var(--pp-accent);font-weight:600;">${esc(p.title)}</p>` : ''}
          </div>
        </div>

        <!-- Services quick list -->
        ${services.length ? `
        <div style="margin-bottom:1.25rem;">
          <p style="font-size:0.63rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--pp-text-muted);margin-bottom:0.65rem;">Available Services</p>
          <div style="display:flex;flex-direction:column;gap:0.45rem;">
            ${services.slice(0,4).map(s=>`
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0.4rem 0;border-bottom:1px solid var(--pp-card-border);">
              <span style="font-size:0.8rem;color:var(--pp-text-muted);font-weight:600;">${esc(s.name)}</span>
              ${s.price ? `<span style="font-size:0.78rem;color:var(--pp-accent);font-weight:800;flex-shrink:0;margin-left:0.5rem;">₹${Number(s.price).toLocaleString('en-IN')}</span>` : ''}
            </div>`).join('')}
            ${services.length > 4 ? `<p style="font-size:0.7rem;color:var(--pp-text-muted);margin-top:0.25rem;">+${services.length-4} more services</p>` : ''}
          </div>
        </div>` : ''}

        <!-- CTA -->
        <a href="/book.html?pro=${encodeURIComponent(p.username)}" class="btn-book-cta" style="width:100%;justify-content:center;">
          <span class="material-symbols-outlined" style="font-size:1rem;">calendar_month</span>
          Book a Session
        </a>

        <!-- Trust note -->
        <div style="display:flex;align-items:center;gap:0.4rem;margin-top:0.85rem;justify-content:center;">
          <span class="material-symbols-outlined" style="font-size:0.82rem;color:var(--pp-text-muted);font-variation-settings:"FILL' 1">shield</span>
          <p style="font-size:0.7rem;color:var(--pp-text-muted);">No payment now · confirm first</p>
        </div>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════════════════════════
   Lightbox
══════════════════════════════════════════════════════════════ */
function openLb(i) {
  const item  = (window._lbMedia || [])[i];
  if (!item || !item.file_url) return;
  const url = item.file_url;
  const isInstagram = url.includes('instagram.com');
  const isEmbed = url.includes('youtube.com/embed') || url.includes('player.vimeo.com') || isInstagram;
  const isVid = item.file_type === 'video';
  const container = document.getElementById('lb-content');
  if (isEmbed) {
    if (isInstagram) {
      container.innerHTML = `
        <div style="position:relative;width:min(340px,90vw);max-height:90vh;border-radius:1rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0" scrolling="no"
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:1rem;">
          </iframe>
          <div style="padding-top:177.78%;"></div>
        </div>`;
    } else {
      container.innerHTML = `
        <div style="position:relative;width:min(850px,90vw);border-radius:1rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;">
          </iframe>
          <div style="padding-top:56.25%;"></div>
        </div>`;
    }
  } else if (isVid) {
    container.innerHTML = `<video src="${esc(url)}" controls autoplay style="width:100%;max-height:82vh;border-radius:1rem;"></video>`;
  } else {
    container.innerHTML = `<img src="${esc(url)}" alt="Portfolio" style="width:100%;max-height:82vh;object-fit:contain;border-radius:1rem;"/>`;
  }
  document.getElementById('lb').classList.add('open');
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lb-content').innerHTML = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

/* ══════════════════════════════════════════════════════════════
   Error state
══════════════════════════════════════════════════════════════ */
function showError(icon, heading, sub) {
  document.getElementById('skeleton-upper').style.display = 'none';
  const pc = document.getElementById('profile-content');
  pc.innerHTML = `
    <div class="state-box" style="grid-column:1/-1;">
      <span class="material-symbols-outlined" style="font-size:4rem;color:var(--pp-text-muted);">${icon}</span>
      <h2 style="font-weight:900;font-size:1.2rem;letter-spacing:-0.01em;color:var(--pp-text-main);">${esc(heading)}</h2>
      ${sub ? `<p style="color:var(--pp-text-muted);font-size:0.88rem;max-width:360px;">${esc(sub)}</p>` : ''}
      <a href="/" class="btn-book-cta" style="margin-top:0.75rem;">
        <span class="material-symbols-outlined" style="font-size:1rem;">home</span>
        Go to CamCrew
      </a>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   Helpers
══════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtPrice(s) {
  if (!s.price) return '';
  return `₹${Number(s.price).toLocaleString('en-IN')} / ${s.unit||'project'}`;
}
function strHue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffffff;
  return Math.abs(h) % 360;
}
</script>

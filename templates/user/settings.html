<!DOCTYPE html>
<html lang="en"><head>

<meta charset="utf-8"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">

          "secondary": "#7b1fa2","secondary-container": "#9c27b0","on-secondary": "#ffffff",
          "surface": "#e0e5ec","background": "#e0e5ec","obsidian-base": "#e0e5ec","charcoal-surface": "#e8edf4",
          "surface-container": "#dde3eb","surface-container-low": "#d8dfe8","surface-container-high": "#cdd5e0",
          "surface-container-highest": "#c8d0de","surface-container-lowest": "#d1d9e6","surface-bright": "#eef1f6",
          "on-surface": "#0f172a","on-surface-variant": "#475569","on-background": "#0f172a","on-primary": "#ffffff",
          "on-primary-container": "#ffffff","on-secondary-container": "#f3e5f5",

<style>
  /* ── Verification — Dark / Light Theme ── */
  :root, [data-theme="dark"] {
    --neu-bg:           #16161e;
    --neu-shadow-dark:  #0d0d16;
    --neu-shadow-light: #1f1f2c;
    --neu-accent:       #1a8aff;
    --neu-accent-glow:  rgba(26,138,255,0.25);
    --neu-text:         #e4e8f6;
    --neu-text-muted:   #7a8599;
    --neu-border:       rgba(255,255,255,0.07);
    --neu-table-head:   rgba(255,255,255,0.05);
    --neu-table-head-text: #7a8599;
    --neu-row-hover:    rgba(255,255,255,0.03);
    --neu-map-gradient: rgba(22,22,30,0.88);
  }
  [data-theme="light"] {
    --neu-bg:           #eef1f8;
    --neu-shadow-dark:  #c5cad8;
    --neu-shadow-light: #ffffff;
    --neu-accent:       #0060cc;
    --neu-accent-glow:  rgba(0,96,204,0.2);
    --neu-text:         #1a1a2e;
    --neu-text-muted:   #5a6880;
    --neu-border:       rgba(0,0,0,0.08);
    --neu-table-head:   #dde3ef;
    --neu-table-head-text: #374263;
    --neu-row-hover:    #d8dfe8;
    --neu-map-gradient: rgba(224,229,236,0.85);
  }
  body {
    background-color: var(--neu-bg);
    color: var(--neu-text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s ease, color 0.3s ease;
    zoom: 0.8;
  }
  h2,h3,h4,h5,h6 { color: var(--neu-text); font-weight: 800; }
  .glass-panel {
    background: var(--neu-bg);
    box-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
    border: none !important;
  }
  .neu-header {
    background: var(--neu-bg);
    box-shadow: 0 4px 10px var(--neu-shadow-dark), 0 -2px 6px var(--neu-shadow-light);
  }
  .neu-btn {
    background: var(--neu-bg);
    box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
    border: none; color: var(--neu-text-muted); transition: all 0.15s ease;
  }
  .neu-btn:hover { box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light); color: var(--neu-accent); }
  .neu-btn:active { box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light); }
  .neu-inset {
    background: var(--neu-bg);
    box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
    border: none !important;
  }
  .neu-inset:focus-within {
    box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light), 0 0 0 2px rgba(0,133,143,0.35);
    outline: none;
  }
  .neu-inset input { background: transparent; color: var(--neu-text); }
  .neu-inset input::placeholder { color: rgba(122,133,153,0.5); }
  input.neu-inset { background: var(--neu-bg) !important; color: var(--neu-text) !important; }
  input.neu-inset::placeholder { color: var(--neu-text-muted) !important; }
  .neu-track {
    background: var(--neu-bg);
    box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light);
  }
  .neu-icon-badge {
    background: var(--neu-bg);
    box-shadow: 3px 3px 7px var(--neu-shadow-dark), -3px -3px 7px var(--neu-shadow-light);
    border-radius: 0.75rem; padding: 0.65rem; display: inline-flex;
  }
  .action-btn-approve {
    background: var(--neu-bg);
    box-shadow: 3px 3px 7px var(--neu-shadow-dark), -3px -3px 7px var(--neu-shadow-light);
    color: #2ea84a; font-weight: 700; font-size: 0.82rem;
    border-radius: 0.5rem; padding: 0.45rem 1.1rem; border: none; transition: all 0.15s ease; cursor: pointer;
  }
  [data-theme="light"] .action-btn-approve { color: #1b5e20; }
  .action-btn-approve:hover { box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light); }
  .action-btn-deny {
    background: var(--neu-bg);
    box-shadow: 3px 3px 7px var(--neu-shadow-dark), -3px -3px 7px var(--neu-shadow-light);
    color: #ff6464; font-weight: 700; font-size: 0.82rem;
    border-radius: 0.5rem; padding: 0.45rem 1.1rem; border: none; transition: all 0.15s ease; cursor: pointer;
  }
  [data-theme="light"] .action-btn-deny { color: #b71c1c; }
  .action-btn-deny:hover { box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light); }
  .view-profile-link { color: var(--neu-accent); font-size: 0.88rem; font-weight: 700; text-decoration: none; }
  .view-profile-link:hover { text-decoration: underline; }
  tr.neu-row:hover { background: var(--neu-row-hover); }
  .stat-pill {
    background: var(--neu-bg);
    box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light);
    border-radius: 1rem; padding: 1.25rem 1.75rem; text-align: center;
  }
  .page-btn-active {
    background: var(--neu-accent); color: #fff; font-weight: 800; font-size: 0.82rem;
    width: 2rem; height: 2rem; border-radius: 0.5rem; border: none; cursor: pointer;
  }
  .page-btn {
    background: var(--neu-bg);
    box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
    color: var(--neu-text-muted); font-weight: 700; font-size: 0.82rem;
    width: 2rem; height: 2rem; border-radius: 0.5rem; border: none; cursor: pointer; transition: all 0.15s;
  }
  .page-btn:hover { color: var(--neu-accent); }
  .page-btn-nav {
    background: var(--neu-bg);
    box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
    color: var(--neu-text-muted); border-radius: 0.5rem; border: none; cursor: pointer;
    padding: 0.35rem; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .page-btn-nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .page-btn-nav:not(:disabled):hover { color: var(--neu-accent); }
  select.neu-select {
    background: var(--neu-bg);
    box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light);
    border: none; color: var(--neu-text); border-radius: 0.5rem; padding: 0.4rem 1rem;
    font-size: 0.88rem; font-weight: 600; appearance: auto;
  }
  [data-theme="dark"] select.neu-select { color-scheme: dark; }
  [data-theme="light"] select.neu-select { color-scheme: light; }
  .map-zone-pill {
    background: var(--neu-bg);
    box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
    border-radius: 9999px; padding: 0.3rem 0.85rem;
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.78rem; font-weight: 600; color: var(--neu-text-muted);
  }
  /* Map gradient adapts to theme */
  .map-gradient-overlay {
    background: linear-gradient(to top, var(--neu-map-gradient), transparent) !important;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--neu-bg); }
  ::-webkit-scrollbar-thumb { background: var(--neu-shadow-dark); border-radius: 10px; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

  /* ── Theme toggle ── */
  #theme-toggle {
    width: 2.4rem; height: 2.4rem; border-radius: 50%; border: none; cursor: pointer;
    background: var(--neu-bg);
    box-shadow: 3px 3px 8px var(--neu-shadow-dark), -3px -3px 8px var(--neu-shadow-light);
    color: var(--neu-accent);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; flex-shrink: 0;
  }
  #theme-toggle:hover {
    box-shadow: 5px 5px 12px var(--neu-shadow-dark), -5px -5px 12px var(--neu-shadow-light), 0 0 14px var(--neu-accent-glow);
    transform: scale(1.08);
  }
  #theme-toggle:active { box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light); }

  /* ── Dark mode overrides for inline-hardcoded colours ── */
  [data-theme="dark"] thead { background: var(--neu-table-head) !important; }
  [data-theme="dark"] thead th { color: var(--neu-table-head-text) !important; }
  [data-theme="dark"] table tbody td { color: var(--neu-text) !important; }
  [data-theme="dark"] h3, [data-theme="dark"] h4 { color: var(--neu-text) !important; }
  [data-theme="dark"] p[style*="color:#334155"] { color: var(--neu-text-muted) !important; }
  [data-theme="dark"] div[style*="color:#0f172a"] { color: var(--neu-text) !important; }
  [data-theme="dark"] div[style*="color:#475569"] { color: var(--neu-text-muted) !important; }
  [data-theme="dark"] span[style*="color:#475569"] { color: var(--neu-text-muted) !important; }
  [data-theme="dark"] span[style*="color:#334155"] { color: var(--neu-text-muted) !important; }
  [data-theme="dark"] strong[style*="color:#0f172a"] { color: var(--neu-text) !important; }
  [data-theme="dark"] [style*="border-bottom:1px solid rgba(0,0,0"] { border-bottom-color: var(--neu-border) !important; }
  [data-theme="dark"] [style*="border-top:1px solid rgba(0,0,0"] { border-top-color: var(--neu-border) !important; }
  /* breadcrumb nav text */
  [data-theme="dark"] nav span[style*="color:#475569"] { color: var(--neu-text-muted) !important; }
  /* stat pill numbers */
  [data-theme="dark"] .stat-pill div[style*="color:#475569"] { color: var(--neu-text-muted) !important; }
  /* pagination count */
  [data-theme="dark"] div[style*="font-size:0.88rem"][style*="color:#334155"] { color: var(--neu-text-muted) !important; }
  [data-theme="dark"] span[style*="font-weight:700"][style*="color:#0f172a"] { color: var(--neu-text) !important; }

  /* ── Light mode table head ── */
  [data-theme="light"] thead { background: var(--neu-table-head) !important; }
  [data-theme="light"] thead th { color: var(--neu-table-head-text) !important; }
</style>
</head>
<body>

<main class="lg:ml-64 min-h-screen flex flex-col">

<script src="/static/js/dashboard-components.js"></script>
<script>
  (function(){
    const root = document.documentElement;
    const saved = localStorage.getItem('cc-theme') || 'dark';
    root.setAttribute('data-theme', saved);
    function updateIcon(t){
      const btn = document.getElementById('theme-toggle');
      if (!btn) return;
      const ic = btn.querySelector('.t-icon');
      if (ic) ic.textContent = t === 'dark' ? 'light_mode' : 'dark_mode';
      btn.title = t === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    }
    updateIcon(saved);
    window.toggleTheme = function(){
      const cur = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', cur);
      localStorage.setItem('cc-theme', cur);
      updateIcon(cur);
    };
    
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#profile-menu-btn') && !e.target.closest('#profile-dropdown')) {
        document.getElementById('profile-dropdown')?.classList.add('hidden');
      }
    });
  })();
</script>
